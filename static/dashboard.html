<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk404 / Returns Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;padding:27px;background:radial-gradient(ellipse at top right,#49466455,transparent 60%),#0c1220;color:#dde7fc;font:12px 'Courier New',monospace}header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #7285a7;padding-bottom:18px}h1{font:italic 48px Impact,'Arial Black',sans-serif;letter-spacing:-1px;margin:10px 0;background:linear-gradient(#fff,#8095b8 40%,#fff 48%,#63799e 54%,#e5eeff 80%);background-clip:text;color:transparent}small{color:#a6b8dc;letter-spacing:2px}header img{width:85px;height:85px;object-fit:contain;pointer-events:none}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:8px;margin:20px 0;border-radius:25px;background:linear-gradient(#b5c4de,#4f6184 48%,#202d49 51%,#8e9ebe);border:1px solid #d6e5ff}button{cursor:pointer;font:italic bold 10px 'Arial Black',sans-serif;color:#14213b;background:linear-gradient(#fff,#9eafcf 45%,#627b9f 51%,#d2e3fd);border:1px solid #ddeaff;border-radius:20px;padding:9px 16px}button.active{background:#1c2944;color:#e1ecff;border-color:#a7bce1}button:focus-visible{outline:2px solid #e7c5ff;outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,section{background:linear-gradient(135deg,#2b3953,#101929);border:1px solid #697e9f;border-radius:14px;box-shadow:inset 0 1px #ffffff22,0 5px 15px #0004}.card{padding:17px}.card strong{display:block;font:italic 30px Impact,sans-serif;margin-top:10px;color:#e7efff}.card span{font-size:9px;letter-spacing:1px;color:#b7caee}section{padding:18px;margin-top:16px;overflow:auto}h2{font:italic 15px 'Arial Black',sans-serif;letter-spacing:1px;margin-top:0}h2:before{content:'';background:url('assets/stars-transparent.png') center/contain no-repeat;width:25px;height:25px;display:inline-block;vertical-align:middle;margin-right:8px}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:10px;text-align:left;border-bottom:1px solid #6f85a04a;line-height:1.6}th{color:#bfcfee;background:#344561;font-size:9px;text-transform:uppercase}td{font-size:11px}.empty{text-align:center;padding:55px 25px}.empty img{width:100px}.empty p{line-height:1.8;color:#b1c2e0}.bar{height:9px;border-radius:7px;background:#080d18;min-width:85px;margin-top:6px}.bar i{display:block;max-width:100%;height:100%;background:linear-gradient(#e9f3ff,#728eb8 50%,#becded);border-radius:7px}.note{font-size:10px;line-height:1.7;color:#9eafce}.severity{border:1px solid #c7acdc;border-radius:12px;padding:3px 7px;white-space:nowrap}input{background:#101a2f;color:#dbe6fa;border:1px solid #7e91b2;border-radius:20px;padding:10px;width:min(300px,100%);margin-bottom:12px}.status{color:#c2e4ba}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:35px}body{padding:16px}header img{width:60px}}
</style></head><body><header><div><small>RISK404 / LIVE CSV ANALYSIS</small><h1>Returns<span class="exe">.exe</span></h1><small id="stamp">WAITING FOR DATA</small></div><img src="assets/stars-transparent.png" alt=""></header><nav aria-label="Analysis views" class="tabs" id="tabs" hidden></nav><main id="content"><section class="empty"><img src="assets/orbit-transparent.png" alt=""><h2>INSERT YOUR DATA</h2><p>Upload customers, orders, and returns CSVs to start your scan.<br>Your uploaded results will appear here.</p><button id="start">UPLOAD FILES →</button></section></main><script>
let data=null,tab='overview',reviewed=new Set();const root=document.getElementById('content'),tabs=document.getElementById('tabs');const labels={overview:'01 / OVERVIEW',products:'02 / PRODUCTS',damage:'03 / DAMAGE',alerts:'04 / ALERTS',tasks:'05 / TASKS',audit:'06 / DATA AUDIT'};function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=String(value??'');if(cls)n.className=cls;return n}const num=x=>Number(x||0).toLocaleString('en-CA',{maximumFractionDigits:2}),money=x=>'$'+num(x),pct=x=>num(x)+'%';function panel(title){const s=el('section');s.append(el('h2',title));return s}function table(title,rows,cols){const s=panel(title);if(!rows.length){s.append(el('p','No records for this scan.'));return s}const t=el('table'),h=el('tr');cols.forEach(c=>h.append(el('th',c[1])));t.append(h);rows.forEach(row=>{const tr=el('tr');cols.forEach(([key,label,format])=>{const td=el('td');const value=format?format(row[key],row):row[key];if(value instanceof Node)td.append(value);else td.textContent=String(value??'');tr.append(td)});t.append(tr)});s.append(t);return s}function setTab(name){tab=name;render()}
// Charts use the same API response as the tables. No chart library or extra backend is needed.
// Every product remains visible; scroll a chart if there are many products.

// Use existing backend risk levels, scoped to the metric shown in each chart.
function riskLevel(row, options = {}) {
    let level = 'normal';
    const rule = options.rate ? 'High Return Rate' : options.damage ? 'Shipping Damage' : null;
    if (options.rate && Number(row.unit_return_rate) > 10 && Number(row.units_sold) >= 100) level = 'high';
    if (options.damage) {
        const amount = Number(row.damage_refunds) || 0;
        level = amount > 50000 ? 'critical' : amount > 10000 ? 'high' : 'normal';
    }
    // Product-total-refund bars inherit the highest risk detected for that product.
    for (const alert of (data?.alerts || [])) {
        if (alert.product !== row.product || (rule && alert.rule !== rule)) continue;
        const severity = String(alert.severity || '').toLowerCase();
        if (severity === 'critical') return 'critical';
        if (severity === 'high') level = 'high';
    }
    return level;
}
function riskBadge(level) { return el('span', level.charAt(0).toUpperCase() + level.slice(1), 'risk-badge ' + level); }
function riskLegend() {
    const legend = el('div', undefined, 'risk-legend');
    ['critical', 'high', 'normal'].forEach(level => legend.append(riskBadge(level)));
    return legend;
}

function chart(title, description, rows, key, format, options = {}) {
    const section = panel(title);
    section.classList.add('chart-panel');
    section.append(el('p', description, 'chart-description'), riskLegend());
    if (!rows.length) {
        section.append(el('p', 'No matching records in this scan.', 'chart-empty'));
        return section;
    }
    const sorted = rows.slice().sort((a, b) => Number(b[key] || 0) - Number(a[key] || 0));
    const largest = Math.max(...sorted.map(row => Number(row[key]) || 0));
    const rawMax = Math.max(1, largest * 1.08);
    const magnitude = 10 ** Math.floor(Math.log10(rawMax));
    const max = options.rate ? Math.max(15, Math.ceil(largest / 5) * 5) : Math.ceil(rawMax / magnitude) * magnitude;
    const scroller = el('div', undefined, 'chart-scroll');
    scroller.tabIndex = 0;
    scroller.setAttribute('aria-label', title + '. Scroll for all products.');
    sorted.forEach(row => {
        const value = Number(row[key]) || 0;
        const group = el('div', undefined, 'chart-row');
        const label = el('div', undefined, 'chart-label');
        label.append(el('span', row.product), el('strong', format(value)));
        const track = el('div', undefined, 'chart-track');
        const bar = el('div', undefined, 'chart-fill');
        const level = riskLevel(row, options);
        bar.classList.add(level);
        label.append(riskBadge(level));
        bar.style.width = (Math.max(0, value) / max * 100) + '%';
        track.append(bar);
        if (options.rate) {
            const marker = el('span', undefined, 'chart-marker');
            marker.style.left = (10 / max * 100) + '%';
            marker.title = '10% return-rate reference';
            track.append(marker);
        }
        group.append(label, track);
        if (options.rate) group.append(el('small', num(row.units_returned) + ' returned / ' + num(row.units_sold) + ' sold' + (level !== 'normal' ? ' · ' + level.toUpperCase() + ' RETURN RATE' : ''), 'chart-detail'));
        scroller.append(group);
    });
    section.append(scroller);
    const axis = el('div', undefined, 'chart-axis');
    [0, max / 2, max].forEach(value => axis.append(el('span', format(value))));
    section.append(axis);
    if (options.rate) section.append(el('p', 'Dashed line: 10%. A high-return alert also requires at least 100 units sold.', 'chart-footnote'));
    if (!options.rate && !options.damage) section.append(el('p', 'Colors show the highest detected risk for each product; refund amount alone does not determine severity.', 'chart-footnote'));
    if (options.damage) section.append(el('p', 'Damage severity follows refund totals: High above $10,000; Critical above $50,000. Unit counts inherit that severity.', 'chart-footnote'));
    return section;
}
function chartPair(a, b) {
    const grid = el('div', undefined, 'chart-grid');
    grid.append(a, b);
    return grid;
}

function render(){if(!data)return;tabs.hidden=false;tabs.replaceChildren();Object.entries(labels).forEach(([key,label])=>{const b=el('button',label,key===tab?'active':'');b.onclick=()=>setTab(key);tabs.append(b)});root.replaceChildren();const s=data.summary;if(tab==='overview'){const cards=el('div',undefined,'cards');[['TOTAL ORDERS',num(s.total_orders)],['TOTAL REFUNDS',money(s.total_refunds)],['UNIT RETURN RATE',pct(s.unit_return_rate)],['ACTIVE ALERTS',num(data.alerts.length)]].forEach(([title,value])=>{const c=el('div',undefined,'card');c.append(el('span',title),el('strong',value));cards.append(c)});root.append(cards,table('RETURN SUMMARY',[s],[['returned_orders','Returned orders',num],['total_units_sold','Units sold',num],['total_units_returned','Units returned',num],['order_return_rate','Order return rate',pct]]),table('REFUNDS BY REASON',data.reason_analysis,[['reason','Reason'],['return_records','Records',num],['total_refunds','Refunds',money],['refund_share','Share',pct]]),table('REFUNDS BY CATEGORY',data.category_analysis,[['category','Category'],['return_records','Records',num],['total_refunds','Refunds',money]]));root.append(el('p','Rates and refunds reflect matched valid returns after cleaning. Figures cover the uploaded dataset, without a year filter.', 'note'))}if(tab==='products'){root.append(chartPair(chart('Unit return rate','Compare the share of sold units returned for each product.',data.product_analysis,'unit_return_rate',pct,{rate:true}),chart('Refunds by product','See which products account for the largest refund amounts.',data.product_analysis,'total_refunds',money)));root.append(table('PRODUCT RETURN RATES',data.product_analysis,[['product','Product'],['units_sold','Units sold',num],['units_returned','Units returned',num],['unit_return_rate','Unit return rate',(v,row)=>{const n=el('div',pct(v)),bar=el('div',undefined,'bar'),i=el('i');i.className=riskLevel(row,{rate:true});i.style.width=Math.max(0,Math.min(100,Number(v)||0))+'%';bar.append(i);n.append(bar);return n}],['total_refunds','Refunds',money]]))}if(tab==='damage'){root.append(chartPair(chart('Shipping-damage refunds','Refund amounts for returns marked Damaged in transit.',data.damage_analysis,'damage_refunds',money,{damage:true}),chart('Damaged units by product','Compare the number of units returned because of shipping damage.',data.damage_analysis,'damaged_units',num,{damage:true})));root.append(table('SHIPPING DAMAGE',data.damage_analysis,[['product','Product'],['damage_returns','Return records',num],['damaged_units','Damaged units',num],['damage_refunds','Refunds',money]]),el('p','Shipping damage means return reason “Damaged in transit”. Alerts trigger above $10,000; critical above $50,000.', 'note'))}if(tab==='alerts'){root.append(table('DETECTED RISKS',data.alerts,[['product','Product'],['severity','Severity',v=>el('span',v,'severity '+String(v).toLowerCase())],['rule','Rule'],['message','Finding'],['recommended_action','Recommended action']]))}if(tab==='tasks'){root.append(table('ACTION QUEUE',data.tasks,[['product','Product'],['priority','Priority'],['task','Task'],['status','Review',(v,row)=>{const b=el('button',reviewed.has(row.task_id)?'REVIEWED ✓':'MARK REVIEWED');b.onclick=()=>{reviewed.has(row.task_id)?reviewed.delete(row.task_id):reviewed.add(row.task_id);render()};return b}]]),el('p','Review status lasts for this browser session and resets on a new scan. No messages are sent.', 'note'))}if(tab==='audit'){root.append(table('EXCLUDED / FLAGGED DATA',Object.entries(data.audit).map(([key,value])=>({category:key.replaceAll('_',' '),rows:value})),[['category','Category'],['rows','Rows',num]]),el('p','The backend rejects conflicting IDs and excessive cumulative returned quantities. Exact duplicates are removed by the cleaner; duplicate removal counts are not part of this response.', 'note'))}}
document.getElementById('start').onclick=()=>parent.postMessage('risk404-upload',location.origin);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='risk404-results')return;const d=e.data.result;if(!d?.summary||!Array.isArray(d.alerts))return;data=d;reviewed=new Set();tab='overview';document.getElementById('stamp').textContent='SCAN COMPLETE / '+new Date().toLocaleString();render()});parent.postMessage('risk404-ready',location.origin);
</script></body></html>

bular-nums}.chart-footnote{font-size:12px;line-height:1.65;margin:12px 0 0;color:#d8d9e9}.chart-empty{font-size:16px;color:#c1d0e8;padding:30px 0}.chart-grid+.panel{margin-top:24px}@media(max-width:860px){.chart-grid{grid-template-columns:1fr}.chart-description{min-height:0}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){body{padding:18px 16px 36px;font-size:16px}section{padding:18px}.tabs button{min-width:95px;font-size:13px}.card{padding:14px}.card strong{font-size:25px}header img{width:50px}.chart-label{font-size:14px}}

<style>

nt-family:Oxanium,Arial,sans-serif}button{font-size:12px}@media(max-width:500px){.tabs button{font-size:10px}.chart-label strong{font-size:16px}h2{font-size:15px}.chart-label{font-size:15px}.card strong{font-size:28px}}
