<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk404 / CSV Scan</title><style>body{background:#101522;color:#e1e9fa;font:14px system-ui;max-width:1000px;margin:40px auto;padding:20px}h1{font:italic 48px Impact,sans-serif;background:linear-gradient(#fff,#8196b8,#fff);background-clip:text;color:transparent}form,section{padding:24px;border:1px solid #899fbe;border-radius:18px;background:#1c2940;margin:20px 0}label{display:block;margin:18px 0}input{display:block;margin-top:8px;max-width:100%}button{padding:12px 24px;border-radius:30px;background:linear-gradient(#fff,#879fbe,#e7f4ff);font-weight:bold;cursor:pointer}#status{white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #526580}section{overflow:auto}.cards{display:flex;gap:15px;flex-wrap:wrap}.card{background:#2c3e5a;padding:18px;border-radius:12px}.card strong{display:block;font-size:24px}</style><h1>Risk404 / SCAN.EXE</h1><p>Upload all three CSV files. Figures below come from your uploaded data.</p><form id="scan"><label>Customers CSV<input name="customers" type="file" accept=".csv" required></label><label>Orders CSV<input name="orders" type="file" accept=".csv" required></label><label>Returns CSV<input name="returns" type="file" accept=".csv" required></label><button>UPLOAD & SCAN →</button></form><p id="status" role="status"></p><main id="results"></main><script>
const form=document.querySelector('#scan'),status=document.querySelector('#status'),root=document.querySelector('#results');function text(tag,value){const el=document.createElement(tag);el.textContent=String(value??'');return el}function table(title,rows){const section=text('section','');section.append(text('h2',title));if(!rows.length){section.append(text('p','No records.'));return section}const t=document.createElement('table'),head=document.createElement('tr');Object.keys(rows[0]).forEach(k=>head.append(text('th',k)));t.append(head);rows.forEach(row=>{const tr=document.createElement('tr');Object.values(row).forEach(v=>tr.append(text('td',typeof v==='number'?Number(v.toFixed(2)):v)));t.append(tr)});section.append(t);return section}form.onsubmit=async e=>{e.preventDefault();form.querySelector('button').disabled=true;root.replaceChildren();status.textContent='Scanning your CSV files…';try{const response=await fetch('/analyze',{method:'POST',body:new FormData(form)});const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:JSON.stringify(result.detail));status.textContent='Scan complete. '+result.scope;root.append(table('Overall results',[result.summary]),table('Products',result.product_analysis),table('Return reasons',result.reason_analysis),table('Shipping damage',result.damage_analysis),table('Categories',result.category_analysis),table('Alerts',result.alerts),table('Tasks',result.tasks),table('Data-quality audit',[result.audit]));}catch(err){status.textContent='Scan failed: '+err.message}finally{form.querySelector('button').disabled=false}};
</script></html>
